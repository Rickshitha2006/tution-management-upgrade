<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Fees — Tuition Manager</title>
<meta name="theme-color" content="#1E3A5F">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icons/icon-192.png">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
<script src="https://cdn.jsdelivr.net/npm/exceljs@4.4.0/dist/exceljs.min.js"></script>
</head>
<body>

<header class="tm-topbar">
  <div class="d-flex align-items-center">
    <a href="index.html" class="tm-back">←</a>
    <p class="page-title">Fees</p>
  </div>
</header>

<main class="tm-container">

  <div class="tm-stat-grid mb-3">
    <div class="tm-stat-tile"><div class="value" id="feesStatCollected">₹0</div><div class="label">Total Collected</div></div>
    <div class="tm-stat-tile"><div class="value" id="feesStatCount">0</div><div class="label">Payments Recorded</div></div>
  </div>

  <div class="d-flex justify-content-between align-items-center mb-2 tm-action-row">
    <button id="btnAddPaymentTop" class="btn btn-tm-primary btn-lg-tap">+ Add Payment</button>
    <button id="btnExportPaymentsCsv" class="btn btn-tm-outline" onclick="tmExportPaymentsExcel()">Export Excel</button>
  </div>

  <div class="tm-search-box mb-2">
    <input type="text" id="feesSearchInput" class="form-control" placeholder="Search student…">
    <span class="search-icon">🔎</span>
  </div>
  <select id="feesFilterSelect" class="form-select mb-3">
    <option value="name" selected>Sort: Name</option>
    <option value="paid">Sort: Total paid</option>
    <option value="recent">Sort: Most recent payment</option>
  </select>

  <div id="feesListContainer"></div>

</main>

<!-- Fee Detail Modal -->
<div class="modal fade" id="feeDetailModal" tabindex="-1">
  <div class="modal-dialog modal-dialog-scrollable modal-lg">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title">Fee Details</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
      </div>
      <div class="modal-body" id="feeDetailBody"></div>
      <div class="modal-footer">
        <button type="button" class="btn btn-tm-outline" data-bs-dismiss="modal">Close</button>
        <button type="button" id="btnFeeDetailAddPayment" class="btn btn-tm-primary">Add Payment</button>
      </div>
    </div>
  </div>
</div>

<!-- Add Payment Modal -->
<div class="modal fade" id="paymentModal" tabindex="-1">
  <div class="modal-dialog modal-dialog-scrollable">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title">Add Payment</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
      </div>
      <form id="paymentForm">
        <div class="modal-body">
          <div class="mb-3">
            <label class="form-label">Student *</label>
            <select id="paymentStudentSelect" class="form-select" required></select>
          </div>
          <div class="row">
            <div class="col-6 mb-3">
              <label class="form-label">Payment Date *</label>
              <input type="date" id="paymentDate" class="form-control" required>
            </div>
            <div class="col-6 mb-3">
              <label class="form-label">Amount (₹) *</label>
              <input type="number" id="paymentAmount" min="0.01" step="0.01" class="form-control" required>
            </div>
          </div>
          <div class="mb-3">
            <label class="form-label">Fee For (Month) *</label>
            <input type="month" id="paymentForMonth" class="form-control" required>
            <div class="form-text">Which month this payment covers — not necessarily the month you're paying in. A late August fee paid in September should still say "August".</div>
          </div>
          <div class="mb-3">
            <label class="form-label">Payment Mode *</label>
            <select id="paymentMode" class="form-select" required>
              <option value="Cash">Cash</option>
              <option value="UPI">UPI</option>
              <option value="Bank Transfer">Bank Transfer</option>
              <option value="Other">Other</option>
            </select>
          </div>
          <div class="mb-3">
            <label class="form-label">Reference Number (optional)</label>
            <input type="text" id="paymentReference" class="form-control">
          </div>
          <div class="mb-3">
            <label class="form-label">Notes (optional)</label>
            <textarea id="paymentNotes" class="form-control" rows="2"></textarea>
          </div>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-tm-outline" data-bs-dismiss="modal">Cancel</button>
          <button type="submit" class="btn btn-tm-primary">Save Payment</button>
        </div>
      </form>
    </div>
  </div>
</div>

<nav class="tm-bottom-nav" id="tmBottomNav"></nav>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/config.js"></script>
<script src="js/db.js"></script>
<script src="js/utils.js"></script>
<script src="js/app.js"></script>
<script src="js/fees.js"></script>
<script>
  tmRegisterServiceWorker();
  document.addEventListener("DOMContentLoaded", () => {
    tmInitFeesPage();
  });
</script>
</body>
</html>
