<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Attendance — Tuition Manager</title>
<meta name="theme-color" content="#1E3A5F">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icons/icon-192.png">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
<script src="https://cdn.jsdelivr.net/npm/exceljs@4.4.0/dist/exceljs.min.js"></script>
</head>
<body>

<header class="tm-topbar">
  <div class="d-flex align-items-center">
    <a href="index.html" class="tm-back">←</a>
    <p class="page-title">Attendance</p>
  </div>
</header>

<main class="tm-container">

  <ul class="nav nav-tabs mb-3" id="attendanceTabs">
    <li class="nav-item">
      <button class="nav-link active" id="mark-tab" data-bs-toggle="tab" data-bs-target="#markPane" type="button">Mark Attendance</button>
    </li>
    <li class="nav-item">
      <button class="nav-link" id="history-tab" data-bs-toggle="tab" data-bs-target="#historyPane" type="button">History</button>
    </li>
  </ul>

  <div class="tab-content">

    <!-- Mark Attendance -->
    <div class="tab-pane fade show active" id="markPane">
      <div class="tm-card">
        <div class="row align-items-end g-2">
          <div class="col-7">
            <label class="form-label">Date</label>
            <input type="date" id="attendanceDate" class="form-control">
          </div>
          <div class="col-5">
            <button id="btnMarkAllPresent" class="btn btn-tm-amber w-100 btn-lg-tap">Mark All Present</button>
          </div>
        </div>
      </div>
      <h2 class="h6 mb-2">Attendance — <span id="attendanceDateLabel"></span></h2>
      <div id="attendanceMarkList" class="mb-3"></div>
      <button id="btnSaveAttendance" class="btn btn-tm-primary btn-lg-tap w-100 mb-4">Save Attendance</button>
    </div>

    <!-- History -->
    <div class="tab-pane fade" id="historyPane">
      <div class="tm-card">
        <div class="mb-2">
          <label class="form-label">Student</label>
          <select id="historyStudentSelect" class="form-select"></select>
        </div>
        <div class="mb-2">
          <label class="form-label">Range</label>
          <select id="historyRangeSelect" class="form-select">
            <option value="all">All time</option>
            <option value="today">Today</option>
            <option value="week">This week</option>
            <option value="month" selected>This month</option>
            <option value="custom">Custom date range</option>
          </select>
        </div>
        <div id="historyCustomWrap" class="row g-2 d-none">
          <div class="col-6">
            <label class="form-label">From</label>
            <input type="date" id="historyCustomStart" class="form-control">
          </div>
          <div class="col-6">
            <label class="form-label">To</label>
            <input type="date" id="historyCustomEnd" class="form-control">
          </div>
        </div>
      </div>

      <div class="tm-stat-grid mb-3">
        <div class="tm-stat-tile"><div class="value" id="historyStatTotal">0</div><div class="label">Total Classes</div></div>
        <div class="tm-stat-tile"><div class="value" id="historyStatPresent">0</div><div class="label">Present</div></div>
        <div class="tm-stat-tile"><div class="value" id="historyStatAbsent">0</div><div class="label">Absent</div></div>
        <div class="tm-stat-tile"><div class="value" id="historyStatPct">0%</div><div class="label">Attendance %</div></div>
      </div>

      <div class="d-flex justify-content-end mb-2">
        <button id="btnExportAttendanceCsv" class="btn btn-tm-outline">Export Excel</button>
      </div>

      <div id="attendanceHistoryList"></div>
    </div>

  </div>
</main>

<nav class="tm-bottom-nav" id="tmBottomNav"></nav>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/config.js"></script>
<script src="js/db.js"></script>
<script src="js/utils.js"></script>
<script src="js/app.js"></script>
<script src="js/attendance.js"></script>
<script>
  tmRegisterServiceWorker();
  document.addEventListener("DOMContentLoaded", () => {
    tmInitAttendancePage();
  });
</script>
</body>
</html>
